name: roberta_base_finetune

data:
  text_col: text
  target_col: target

preprocess:
  filtering:
    lower: true
    remove_url: true
    remove_mentions: false
    remove_hashtags_symbol: false
    keep_only_alpha: false
    min_token_len: 1
  tokenizer:
    type: none
  stopwords:
    enabled: false
    language: english
  normalization: none
  duplicates:
    mode: drop_conflict
    text_col: text
    target_col: target
  columns:
    text: text
    out: text_pp
  drop_empty: true

split:
  val_size: 0.1
  test_size: 0.1
  seed: 42
  stratify_col: target

model:
  type: finetune
  params:
    model_name: roberta-base
    num_labels: 2
    max_length: 48          # было 64 -> уменьшил, твиты короткие
    device: cuda

training:
  output_dir: checkpoints
  learning_rate: 1.0e-5     # было 2e-5 -> уменьшил против переобучения
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  num_train_epochs: 3       
  weight_decay: 0.1         # было 0.01 -> увеличил регуляризацию
  warmup_steps: 0.15        
  fp16: true
  eval_strategy: epoch
  save_strategy: epoch
  load_best_model_at_end: true
  metric_for_best_model: f1
  greater_is_better: true
  save_total_limit: 2
  logging_steps: 50
  report_to: none
  seed: 42
  early_stopping_patience: 1

metrics: [accuracy, precision, recall, f1, roc_auc]

clearml:
  project: disaster-tweets
  tags: [finetune, roberta-base, regularized]