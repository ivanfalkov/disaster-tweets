name: lemma_stop_tfidf_gbm

data:
  text_col: text
  target_col: target

preprocess:
  filtering:
    lower: true
    remove_url: true
    remove_mentions: true
    remove_hashtags_symbol: true
    keep_only_alpha: true
    min_token_len: 2
  tokenizer:
    type: tweet
    params:
      preserve_case: false
      strip_handles: true
      reduce_len: true
  stopwords:
    enabled: true
    language: english
  normalization: lemma
  duplicates:
    mode: drop_conflict
    text_col: text
    target_col: target
  columns:
    text: text
    out: text_pp
  drop_empty: true

split:
  val_size: 0.1
  test_size: 0.1
  seed: 42
  stratify_col: target

features:
  builder_output: sparse
  text:
    type: tfidf
    column: text_pp
    params:
      max_features: 50000
      ngram_range: [1, 2]
      sublinear_tf: true
      min_df: 2
  keyword:
    type: onehot
    column: keyword
    normalize: true
    min_freq: 2
  location:
    type: onehot
    column: location
    normalize: true
    min_freq: 5

model:
  type: gbm
  params:
    n_estimators: 200
    learning_rate: 0.1
    max_depth: 3
    subsample: 0.8
    random_state: 42

metrics: [accuracy, precision, recall, f1, roc_auc]

clearml:
  project: disaster-tweets
  tags: [classic_nlp, tfidf, gbm, lemma, stopwords]