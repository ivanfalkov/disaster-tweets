[project]
name = "disaster-tweets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "catboost>=1.2.10",
    "clearml>=2.1.12",
    "click>=8.5.0",
    "datasets>=5.0.1",
    "dotenv>=0.9.9",
    "gensim>=4.4.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "torch",
    "transformers>=5.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 99
target-version = "py312"
exclude = [
    ".venv",
    "artifacts",
    "checkpoints",
    "data",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (импорты)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long — отдаём на откуп line-length
]

[tool.ruff.lint.isort]
known-first-party = ["src", "experiments", "scripts"]