[project]
name = "disaster-tweets"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "clearml>=2.1.12",
    "click>=8.5.0",
    "dotenv>=0.9.9",
    "gensim>=4.4.0",
    "ipykernel>=7.3.0",
    "ipython>=9.17.1",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "nltk>=3.10.3",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pygments>=2.21.0",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
